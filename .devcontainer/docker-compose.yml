name: rust-databases-talk

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/rust-databases-talk:cached
      - cargo-registry:/usr/local/cargo/registry
      - target:/workspaces/rust-databases-talk/target
    environment:
      PGHOST: postgres
      PGUSER: talk
      PGPASSWORD: talk
      PGDATABASE: talk
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: talk
      POSTGRES_DB: talk
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init/20-databases.sql:/docker-entrypoint-initdb.d/20-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d talk"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  cargo-registry:
  target:
  postgres-data:
